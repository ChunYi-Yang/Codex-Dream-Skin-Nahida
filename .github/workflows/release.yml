name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate release version
        shell: pwsh
        run: |
          $version = [System.IO.File]::ReadAllText((Resolve-Path .\windows\VERSION)).Trim()
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "windows/VERSION is not semantic: $version"
          }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match windows/VERSION $version."
          }
          "DREAM_SKIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows tests
        shell: pwsh
        run: |
          foreach ($shell in @('powershell.exe', 'pwsh.exe')) {
            & $shell -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
              -File .\windows\tests\run-tests.ps1
            if ($LASTEXITCODE -ne 0) { throw "Windows regressions failed under $shell." }
            & $shell -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
              -File .\windows\tests\installer-static.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw "Installer checks failed under $shell." }
          }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $requiredVersion = '6.7.1'
          choco upgrade innosetup --version=$requiredVersion --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup $requiredVersion." }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'ISCC.exe is missing.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer and checksum
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'codex-dream-skin-release'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
            -File .\windows\installer\build-release.ps1 `
            -OutputDirectory $output -IsccPath $env:ISCC_PATH
          if ($LASTEXITCODE -ne 0) { throw "Windows release builder failed with exit code $LASTEXITCODE." }
          $artifact = Join-Path $output "CodexDreamSkin-Setup-v$env:DREAM_SKIN_VERSION.exe"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected installer is missing: $artifact"
          }
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $output 'SHA256SUMS.txt'),
            "$hash  $([System.IO.Path]::GetFileName($artifact))`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          "RELEASE_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = Join-Path $env:RELEASE_OUTPUT "CodexDreamSkin-Setup-v$env:DREAM_SKIN_VERSION.exe"
          $checksums = Join-Path $env:RELEASE_OUTPUT 'SHA256SUMS.txt'
          gh release create $env:GITHUB_REF_NAME $artifact $checksums `
            --verify-tag --generate-notes --title "Codex Dream Skin Nahida v$env:DREAM_SKIN_VERSION"
